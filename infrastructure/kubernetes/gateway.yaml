apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cloud-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: cloud-native-api-gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: AUTH_SERVICE_URL, value: http://auth-service:4001 }
            - { name: USER_SERVICE_URL, value: http://user-service:4002 }
            - { name: NOTIFICATION_SERVICE_URL, value: http://notification-service:4003 }
            - { name: ANALYTICS_SERVICE_URL, value: http://analytics-service:4004 }
          readinessProbe: { httpGet: { path: /readyz, port: 8080 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cloud-gateway
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
