apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: cloud-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers: [{ name: auth-service, image: cloud-native-api-gateway-auth:latest, ports: [{ containerPort: 4001 }] }]
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: cloud-gateway }
spec: { selector: { app: auth-service }, ports: [{ port: 4001, targetPort: 4001 }] }
---
